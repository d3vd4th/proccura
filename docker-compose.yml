services:
  # ── Infrastructure ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend Services ────────────────────────────────────────────
  auth_service:
    build: ./backend/auth_service
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./backend/auth_service:/app
    env_file:
      - ./backend/auth_service/.env
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  vendor_service:
    build: ./backend/vendor_service
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    volumes:
      - ./backend/vendor_service:/app
    env_file:
      - ./backend/vendor_service/.env
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  api_gateway:
    build: ./backend/api_gateway
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/api_gateway:/app
    env_file:
      - ./backend/api_gateway/.env
    ports:
      - "8000:8000"
    depends_on:
      auth_service:
        condition: service_started
      vendor_service:
        condition: service_started
      redis:
        condition: service_healthy

  # ── Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_APP_NAME: Proccura
      VITE_APP_ENV: development
    ports:
      - "3000:5173"
    depends_on:
      api_gateway:
        condition: service_started

volumes:
  postgres_data:
